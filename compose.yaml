services:
  deck-delve:
    build: .
    image: deck-delve:latest
    container_name: deck-delve
    restart: unless-stopped
    ports:
      - "${DD_PORT:-8080}:8080"  # set DD_PORT in .env to change the host port
    volumes:
      - deck-delve-data:/data  # the saved game survives restarts
    # Behind Traefik? Remove "ports" and see the README for labels.
volumes:
  deck-delve-data:
